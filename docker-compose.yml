services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trajectoryfit
      POSTGRES_PASSWORD: trajectoryfit
      POSTGRES_DB: trajectoryfit
    ports:
      # Host 5433 avoids colliding with a local Postgres on the default 5432.
      - "5433:5432"
    volumes:
      - trajectoryfit_pgdata:/var/lib/postgresql/data
      # Applied automatically on first initialization of an empty data volume.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trajectoryfit -d trajectoryfit"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/trajectoryfit
      DB_USER: trajectoryfit
      DB_PASSWORD: trajectoryfit
    ports:
      - "8080:8080"

volumes:
  trajectoryfit_pgdata:
